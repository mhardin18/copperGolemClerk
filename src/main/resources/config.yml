# Copper Golem Clerk configuration
#
# Copper golems take items out of copper chests and put them away. With this plugin
# they file them properly: by group (birch logs go in with the oak logs), by label
# (a sign like [logs] or an item in a frame on the chest), and into [Overflow]
# chests when nothing else fits.
#
# Every setting below has a default, so a setting missing from this file still
# works. The README lists them all: https://github.com/mhardin18/copperGolemClerk
#
# Use /cgc reload after editing this file (no restart needed).

# How a chest qualifies for a group match:
#   all - every item in the chest must share a group with the carried item.
#         This keeps sorted chests tidy: one stray item stops group matching.
#   any - one item from the same group is enough.
match-mode: all

# Vanilla golems walk to the nearest chest they haven't tried, and drop their
# item into the first empty chest they reach, often before finding the chest
# where it belongs.
#
# With prefer-matching-chests on, a golem carrying an item first looks over every
# chest in its range (32 blocks sideways, 8 up/down, loaded chunks only). If one
# matches the item (item frame label, same item, or same group) and has room, the
# golem walks straight to it and ignores empty chests. Empty chests are used only
# when no matching chest has room.
prefer-matching-chests: true

# If a golem can't deliver its item, it works through these steps, each lasting
# matching-chest-timeout-seconds:
#   1. Go to the most specific matching chest (labels first, then contents),
#      then an [Overflow] chest, then an empty chest.
#   2. The most specific chest may be unreachable: any matching chest.
#   3. Assume matching chests are unreachable: [Overflow] or empty chests only.
#   4. Vanilla behavior: wander from chest to chest.
#   5. Put the item back into the copper chest it came from (see below).
# Time only counts while the golem is likely active: walking, or with a player
# within spigot.yml's entity-activation-range for animals (32 by default).
# Further away, Paper runs golems in short bursts about once a minute, and a
# paused golem shouldn't run out of time. A golem waiting in line next to a
# chest that takes its item is never sent back.
matching-chest-timeout-seconds: 30

# After step 4, put the item back into the copper chest the golem took it from
# (or the nearest copper chest in range with room). Golems can't walk to a copper
# chest while carrying something, so the item is moved back directly.
# Returned items are marked "no home" for that copper chest: golems take other
# items first, and skip the chest if only "no home" items are left. The mark
# lasts homeless-retry-minutes, or until /cgc reload. Add a home for
# the item (a group, a label, an [Overflow] chest), then reload.
return-unsortable-items: true
homeless-retry-minutes: 5

# Set to false to stop golems from ever using empty chests. Put one item into
# each chest (or use item frame labels) to say what goes there, and keep a
# labeled catch-all chest for anything without a home, or golems will carry
# unsortable items around forever.
allow-empty-chests: true

# Item frame labels: hang an item frame (or glow item frame) holding an item on
# any side of a chest, and golems will put ONLY that exact item in that chest.
# This overrides groups and allow-empty-chests. Several frames on one chest
# allow each framed item. Empty frames are ignored. Matching is by item type
# (all enchanted books count as the same item, for example).
item-frame-labels: true

# Sign labels: put a wall sign on any side of a chest (or a standing sign on
# top) and write rules on it, one per line, in square brackets:
#   [logs]           a group from the list below
#   [oak log]        one item (spaces or underscores, any capitalization)
#   [*_ORE]          a name pattern
#   [#planks]        an item tag
# Golems then put only matching items in that chest, like item frame labels.
# If a word is both a group and an item, the group wins: [stone] = stone group.
# Group names work singular or plural: [Rail] = rails, [ore] = ores,
# [light source] = light-sources. If a word matches no group and no item, it
# matches items with that word in their name: [carpet] = every carpet.
# When several chests accept an item, golems use the most specific one: a
# framed item or exact match first, then the label or group with the fewest
# items ([stews] beats [food] for a stew).
# Frames and signs on one chest combine: any matching label accepts the item.
#
# [Overflow] (any capitalization) makes a catch-all chest: golems put an item
# there only when no matching chest has room for it. Overflow chests never
# attract items just because a similar item is already inside.
sign-labels: true

# When no matching chest has room, use overflow chests before empty chests.
# Set to false to fill empty chests first and use overflow as the last resort.
overflow-before-empty: true

# When a golem has nothing to do (empty hand, and no copper chest in range has
# anything it would take), send it to an [Overflow] chest to fetch an item that
# now has a home, e.g. ores after you add an [ores] chest. It takes up to
# carry-amount (16 by default), like a normal pickup, and sorts them. Items that would just go back to overflow are
# left alone. If it can't reach the overflow chest within 30 seconds it gives
# up and waits a minute. Items it can't deliver go back to that chest.
fetch-from-overflow: true

# How many golems may fetch from one overflow chest at the same time (each takes
# a different item). Higher empties overflow faster but can crowd the chest.
fetchers-per-overflow-chest: 2

# How many items a golem carries per trip (1 to 64; vanilla is 16). Right after a golem
# takes items out of a copper chest, it takes more of the same from that chest (or puts
# some back, below 16). Items that stack to 16 or 1 (ender pearls, tools) are carried
# that many at most. Higher means fewer trips for big sorting jobs.
carry-amount: 16

# /cgc find <item>: which containers near a player hold an item. By default players only
# see containers inside GriefPrevention claims they own (never locked ones).
# find-outside-own-claims: true also shows unclaimed containers and claims where they have
# container trust; other players' claims stay hidden either way. Without GriefPrevention
# there are no claims, so players find nothing unless this is true.
# coppergolemclerk.allclaims (ops) sees everything. find-enabled: false turns the command
# off. find-radius: how far it looks (1 to 64 blocks, sideways and up/down).
# find-highlight-count: how many of the containers it finds glow for the player who asked,
# nearest first (0 to 30; 0 = no glow). find-highlight-seconds: how long they glow (0 = no glow).
find-enabled: true
find-outside-own-claims: false
find-radius: 32
find-highlight-count: 5
find-highlight-seconds: 10

# Golems give way to each other instead of getting stuck nose to nose. When a
# golem is stuck (trying to walk but barely moving for a second) because another
# golem is in its way, one of them steps one block aside and waits for the other
# to pass: a golem with empty hands gives way to one carrying an item. If both
# carry something (or both are empty), the same golem of the pair always gives
# way. Golems busy at a chest never step aside.
golems-give-way: true

# Golems never walk onto or through a trapdoor, open or closed. Vanilla golems
# treat an open trapdoor as floor and fall through it into the hole below.
# Golems stepping aside for each other (golems-give-way) avoid trapdoors too.
avoid-trapdoors: true

# Golems never go through a Nether portal, End portal or End gateway, so one that
# wanders into a portal stays in its own world near its copper chest. Golems on a
# lead or riding something go through as usual (a player is taking them).
avoid-portals: true

# Once a week (and a minute after the server starts), check GitHub for a newer
# release of this plugin. If there is one, it's logged and admins (op, or the
# coppergolemclerk.admin permission) are told once when they join. Nothing is
# downloaded or sent besides the request itself. /cgc version checks right away.
update-check: true

# How high golems reach, in chest rows counted up from the floor they stand on:
# 1 is the chest at their feet, 2 the one on top of it. Vanilla golems reach 2.
# Raise these (up to 6) for taller stacks of chests: golems walk to the foot of the
# stack and the plugin moves the items for them. They need floor to stand on in
# front of the chest.
#   deliver-reach: chests golems put items into (labelled, matching, [Overflow], empty)
#   take-reach:    copper chests golems take items from, and [Overflow] chests that
#                  idle golems fetch from
deliver-reach: 2
take-reach: 2

# Which containers golems put items into. Vanilla golems only use chests and trapped
# chests. Add barrel and/or shulker_box (every colour) and golems use those too: the
# golem walks up to it and the plugin puts the item in, with labels, contents matching
# and [Overflow] working as for chests. Take chest out to keep golems away from plain
# chests. (Golems always take items from copper chests.)
destination-containers: [chest, trapped_chest]

# Players can switch a single copper golem back to plain vanilla behavior (and back
# again) by right-clicking it with this item. While a player holds it, golems using
# this plugin show that player a small green light on their antenna; vanilla golems
# don't. Where GriefPrevention is
# installed, only players allowed to build where the golem stands can switch it.
# Needs the coppergolemclerk.toggle permission (everyone has it by default).
# Set to none to turn switching off.
golem-toggle-item: bamboo
# Show the green light (to players holding the toggle item) on golems that use this plugin.
mode-markers: true
# While a player holds the toggle item, golems near them also show a small label
# saying what they're doing ("carrying 12 birch log", "fetching granite", "lost,
# walking home", "idle") and how weathered their copper is. Only players holding the
# item see them.
status-labels: true

# A copper golem with nothing to do walks over to say hello to an iron or snow
# golem within 16 blocks, then goes back to its routine. It doesn't follow them,
# and waits greet-cooldown-minutes before greeting again.
greet-other-golems: true
greet-cooldown-minutes: 5

# Lost golems: each golem remembers the copper chest it last took items from. If it ends
# up far from any copper chest (more than 40 blocks from its own, or 12 up or down, e.g.
# after falling down a shaft), it walks back. If it can't get any closer, or it's stuck
# where it can't walk to a copper chest (a pit, walled in), its owner gets an alert
# (see below) saying where it is, and it tries again every 5 minutes. A golem moved to a
# place with its own copper chest just adopts that one. Golems on a lead are left alone.
rescue-lost-golems: true
# Teleport a golem that can't walk back to its copper chest, instead of only telling the
# owner. Off by default. Even when on, a golem is only teleported if the owner of the
# GriefPrevention claim its copper chest is in has the coppergolemclerk.teleport
# permission (nobody has it unless you grant it, e.g. with LuckPerms; for an owner who's
# offline the plugin asks LuckPerms). Golems whose chest isn't in a claim are never
# teleported.
lost-golem-teleport-home: false

# Alerts: players are told when a golem is lost (above), finds a labelled chest full, or
# an [Overflow] chest is filling up. An alert goes to the owner of the GriefPrevention claim where it
# happens (an owner who's offline is told when they join); outside claims, or without
# GriefPrevention, to online players with coppergolemclerk.alerts (ops by default).
# Every alert is also written to the server log.
full-chest-alerts: true
# Warn when an [Overflow] chest has at least this many of its slots in use (percent).
# 0: only when it's completely full.
overflow-alert-percent: 90
# Don't repeat an alert about the same chest more often than this.
alert-cooldown-minutes: 30

# When a player joins, tell them how many items golems sorted in their claims while
# they were away, and how many of their chests filled up (without GriefPrevention:
# server-wide numbers, for players with coppergolemclerk.alerts). /cgc stats shows
# the numbers any time.
join-summary: true

# Write a line in the server log when a copper golem dies (with the cause, e.g.
# lava, fall or a mob, and what it was holding) or is removed another way (turned
# into a statue, /kill, another plugin). Golems never despawn, so this explains
# every golem that goes missing.
log-golem-deaths: true

# Golems tidy a chest while putting something in it: partial stacks of the same
# item are merged, and like items are moved next to each other (by group, in the
# order the groups are listed below). Copper chests and chests a player has open
# are left alone.
tidy-chests: true

# Worlds where the plugin does nothing (golems there behave as in vanilla), by
# folder name, e.g. [world_nether, world_the_end].
disabled-worlds: []

# Golem limits: how many copper golems in one GriefPrevention claim (max-golems-per-claim;
# each claim on its own, admin claims too), or on unclaimed land in one world
# (max-golems-outside-claims; without GriefPrevention that's every golem in the world), use
# this plugin. The oldest golems keep it; the newest over the limit sort like vanilla, and the
# claim owner (or players with coppergolemclerk.alerts) is told. 0 = no limit.
# Each working golem costs about 0.1 ms per tick with or without this plugin, so golems over
# the limit still cost the same tick time (see the README).
max-golems-per-claim: 0
max-golems-outside-claims: 0

# Let players use /cgc golems to list their own golems (in claims they own, or whose
# copper chest is in one; without GriefPrevention, the golems within 48 blocks of them).
# Off by default: only admins can use it.
golems-command-for-players: false

# Log every sort decision to the console. Useful while setting up groups.
debug: false

# Diagnostics: log each golem's state, position and held item when they change.
# Very chatty; leave off unless you're investigating what golems are doing.
trace-golems: false

# Each group is a list of entries. An item can be in more than one group.
# Entry formats:
