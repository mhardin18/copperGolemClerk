# Copper Golem Clerk configuration
#
# Copper golems take items out of copper chests and put them away. With this plugin
# they file them properly: by group (birch logs go in with the oak logs), by label
# (a sign like [logs] or an item in a frame on the chest), and into [Overflow]
# chests when nothing else fits.
#
# The item groups are in groups.yml, next to this file.
#
# Every setting has a default, so a setting missing from this file still works.
# The README lists them all: https://github.com/mhardin18/copperGolemClerk
#
# When you upgrade the plugin, settings that are new in that version are added to this
# file at startup, each with its explanation. The explanation above every other setting
# is replaced with the new version's. Your values are never changed.
# To keep a note of your own, put it at the end of a setting's line
# (carry-amount: 32  # our farm). A comment on its own line above a setting is replaced.
# The old file is kept as config-before-<version>.yml.
#
# Run /cgc reload after editing this file. No restart is needed.

# How a chest qualifies for a group match:
#   all - every item in the chest must share a group with the carried item.
#         One stray item stops group matching, which keeps sorted chests tidy.
#   any - one item from the same group is enough.
match-mode: all

# Vanilla golems walk to the nearest chest they haven't tried. They drop their item
# into the first empty chest they reach, often before finding the chest it belongs in.
#
# With prefer-matching-chests on, a golem carrying an item first looks at every chest
# in its range (search-distance sideways, 8 up and down, loaded chunks only). If a
# chest matches the item (item frame label, same item or same group) and has room,
# the golem walks straight to it and ignores empty chests. Empty chests are used
# only when no matching chest has room.
#
# If a golem can't deliver its item, it works through these steps. Each step lasts as
# long as it takes to walk to the farthest chest it tries (30 seconds or more).
# A step with nothing new to try is skipped.
#   1. Go to the most specific matching chest (labels first, then contents),
#      then an [Overflow] chest, then an empty chest.
#   2. The most specific chest may be unreachable, so try any matching chest.
#   3. Assume matching chests are unreachable and try [Overflow] or empty chests only.
#   4. Vanilla behavior for 30 seconds: wander from chest to chest.
#   5. Put the item back into the copper chest it came from (see below).
# An item with no home in range goes straight to step 4.
#
# Time only counts while the golem is likely active: walking, or with a player within
# spigot.yml's entity-activation-range for animals (32 by default). Further away,
# Paper runs golems in short bursts about once a minute, and a paused golem should
# not run out of time. A golem waiting in line next to a chest that takes its item
# is never sent back.
prefer-matching-chests: true

# After step 4, put the item back into the copper chest the golem took it from, or the
# nearest copper chest in range with room. Golems can't walk to a copper chest while
# carrying something, so the plugin moves the item back directly.
# Returned items are marked "no home" for that copper chest. Golems take other items
# first, and skip the chest if only "no home" items are left. The mark ends after
# homeless-retry-minutes, on /cgc reload, or when a sign or item frame label is added
# or changed within search-distance of the chest. Golems then try the item again at once.
# false: golems hold an item with no home forever, as vanilla golems do.
return-unsortable-items: true
# How long a returned item stays marked "no home" for its copper chest, in minutes
# (1 or more). While it is marked, golems skip it (see return-unsortable-items).
# Lower: golems retry sooner, with more wasted trips if the item still has no home.
# Higher: a home you add later is used only after this long. A new label nearby or
# /cgc reload clears the mark at once.
homeless-retry-minutes: 5

# Set to false to stop golems from ever using empty chests. Then put one item in each
# chest (or use item frame labels) to say what goes there. Also keep a labeled
# catch-all chest for items without a home, or golems will carry them around forever.
allow-empty-chests: true

# Item frame labels: hang an item frame (or glow item frame) holding an item on any
# side of a chest, and golems put ONLY that exact item in that chest.
# This overrides groups and allow-empty-chests. Several frames on one chest allow
# each framed item. Empty frames are ignored. Matching is by item type, so all
# enchanted books count as the same item, for example.
item-frame-labels: true

# Sign labels: put a wall sign on any side of a chest (or a standing sign on top)
# and write rules on it in square brackets, one or more per line.
# A rule too long for one line can continue on the next. Leave the [ open and close
# it later: "[Only light" then "sources]" gives [Only light sources]. Lines are joined
# with a space, or with nothing after a - or _. An unclosed rule is ignored
# (/cgc check says so).
#   [logs]           a group from groups.yml
#   [oak log]        one item (spaces or underscores, any capitalization)
#   [*_ORE]          a name pattern. * stands for any letters (or none) in the item's ID,
#                    and the whole ID must fit. [*sand] matches IDs ending in sand
#                    (sand, red sand, soul sand, not sandstone). [sand*] matches IDs
#                    starting with sand (sand, sandstone...). [*sand*] matches IDs
#                    containing it. [*] alone matches every item. On a chest it is
#                    picked before [Overflow] and empty chests, so use [Overflow] for
#                    a catch-all. On a furnace it matches anything the furnace can cook.
#   [#planks]        an item tag: # then a vanilla or datapack tag name ([#logs] or
#                    [#minecraft:logs]). An unknown tag, or a bare [#], matches nothing.
#   [@edible]        a property: @edible, @fuel (burns in a furnace) or @record
# A label with *, # or @ is never read as a group name.
# Golems then put only matching items in that chest, like item frame labels.
#
# Name rules:
# - If a word is both a group and an item, the group wins: [stone] is the stone group,
#   [terracotta] is the terracotta group (glazed too).
# - Groups renamed in 3.1.0 answer to both names: [smithing templates] = [templates],
#   [crafting materials] = [materials], [saplings and leaves] = [foliage], and
#   [concrete and terracotta] = both the concrete and terracotta groups.
# - Group names work singular or plural: [Rail] = rails, [ore] = ores,
#   [light source] = light-sources.
# - If a word matches no group and no item, it matches items with that word in their
#   name: [carpet] = every carpet.
#
# When several chests accept an item, golems use the most specific one: a framed item
# or exact match first, then the label or group with the fewest items
# ([stews] beats [food] for a stew).
# Frames and signs on one chest combine: any matching label accepts the item.
#
# [Overflow] (any capitalization) makes a catch-all chest. Golems put an item there
# only when no matching chest has room for it. Overflow chests never attract items
# just because a similar item is already inside.
sign-labels: true

# When no matching chest has room, use overflow chests before empty chests.
# Set to false to fill empty chests first and use overflow as the last resort.
overflow-before-empty: true

# When a golem has nothing to do (empty hand, and no copper chest in range has
# anything it would take), it can fetch an item from an [Overflow] chest if that item
# now has a home, e.g. ores after you add an [ores] chest. It takes up to
# carry-amount (16 by default), like a normal pickup, and sorts them.
# Items that would just go back to overflow are left alone.
# The golem gives up and waits a minute if it stops getting closer to the overflow
# chest for 10 seconds, or if the walk takes longer than its limit (the limit grows
# with search-distance). If the item loses its home on the way (that chest fills up
# or is removed), the golem stops without taking anything. Items it can't deliver
# go back to that chest.
fetch-from-overflow: true

# How many golems may fetch from one [Overflow] chest at the same time. 0 = no limit.
# Each fetcher takes a different item, so a chest holding 2 kinds of items never
# draws more than 2 golems, whatever this is set to.
# Fetching is the last thing an idle golem does (after furnace jobs and copper
# chests), so a higher limit never takes a golem away from other work. It only puts
# golems to work that would otherwise stand around.
# Too many crowd the chest: each golem walks to the open spot beside the chest
# nearest to it, so golems coming from the same side queue for the same spot. A
# chest set into a wall has 1 open spot in front (2 for a double chest). More than
# about 2 golems per open spot mostly wait their turn and get in the way of players
# using the chest. A pickup only takes a moment, so a short queue is still faster
# than golems standing idle.
# 4 suits a double chest open at the front. Use 2 for a single chest in a wall, and
# more for a chest open on several sides. 0 can put a dozen golems at one chest on a
# big farm.
fetchers-per-overflow-chest: 4

# For an [Overflow] chest that a hopper fills (a hopper above it facing down, or
# beside it facing into it, like a smelter's output chest): golems fetch an item from
# it only once this many of it are there (1 to 64). This stops them walking over for
# every ingot the hopper drops in. Items that stack to less than this (ender pearls,
# tools) are fetched once a full carry of them is there.
# Overflow chests without a hopper feeding them are emptied right away as usual.
# 1: no waiting, a trip for every item, as before 3.0.0.
# carry-amount (16): only full trips. Anything above carry-amount works the same.
# See also overflow-fetch-wait-seconds.
overflow-fetch-min: 8
# For an [Overflow] chest that a hopper fills: golems also fetch an item once it has
# waited there this many seconds (0 to 3600), even with fewer than overflow-fetch-min
# of it. This way the last few items of a smelting run still get sorted. Each fetch
# starts the wait again for what is left.
# 0: no waiting at all (same as overflow-fetch-min: 1).
# Higher: items can sit in the overflow chest longer before they are put away.
overflow-fetch-wait-seconds: 120

# How many items a golem carries per trip (1 to 64; vanilla is 16). Right after a golem
# takes items out of a copper chest, it takes more of the same item from that chest
# (or puts some back, below 16). Items that stack to 16 or 1 (ender pearls, tools) are
# carried up to that many. Higher means fewer trips for big sorting jobs.
carry-amount: 16

# Golems run furnaces, smokers and blast furnaces that have a label (a sign or item
# frame, like a chest's) saying what to cook there: [raw iron], [sand]...
# Unlabelled furnaces are left alone.
# Items to cook come ONLY from containers with a [Furnace Supply] sign. Idle golems
# fetch from them and split each load between up to 2 labelled furnaces that take it.
# Only items that the label covers AND that kind of furnace can cook go in
# (/cgc check on the furnace lists them).
# Idle golems take out what is done and sort it, unless a hopper under the furnace
# collects it. Things taken out of a furnace never go back into one.
# A chest sitting on a hopper that leads into a furnace (a hand-built smelter) is
# never sorted into.
#
# false turns ALL of this off:
# - Golems leave every furnace alone.
# - [Fuel] and [Furnace Supply] signs mean nothing, so those chests are sorted into
#   like any other.
# - Chests on a smelter's hopper are ordinary chests again, so golems may sort random
#   items into them.
#
# An idle golem picks its furnace job in this order:
#   1. Empty a furnace whose output slot is full (it has stopped).
#   2. Take out an empty lava bucket (or fetch one waiting in [Fuel] once a lava cauldron
#      is full).
#   3. Bring fuel.
#   4. Bring items to cook to a furnace running low.
#   5. Take out finished items (see furnace-take-out-at).
# Two golems never take the same job at the same furnace.
furnace-feeding: true
# Fuel, most preferred first. Golems take fuel ONLY from containers with a [Fuel] sign.
# They use the first fuel in this list that one of those containers holds, and bring
# enough for what is waiting plus furnace-fuel-ahead.
# A furnace burning a fuel lower on the list is left to burn out before it gets the
# better one. Fuel you put in yourself that is not in this list is left alone.
# Fuel a golem couldn't put in (the furnace got fuelled meanwhile) goes back to a
# [Fuel] container.
# Empty buckets left by lava are refilled only at a lava cauldron nearby (never from
# lava in the world) and put back in a [Fuel] container.
# A cauldron refilled by dripping lava (pointed dripstone hanging over it, with lava on
# top of the block the dripstone hangs from) is waited for. Until it is full, empty
# buckets go into a [Fuel] container, and an idle golem fills one as soon as it is full.
# With no such cauldron nearby and none full, an empty bucket is sorted like anything
# else.
# Empty buckets golems pick up for sorting (from an [Overflow] chest or a copper chest)
# are refilled the same way when a lava cauldron is nearby and a [Fuel] container has
# room: one at a time straight to a full cauldron, or into [Fuel] to wait. Empty buckets
# never go into a [Fuel] container that feeds a furnace through a hopper (the hopper
# would push them into the furnace); with only those, buckets in [Overflow] wait there
# until a cauldron is full. Otherwise they are sorted like anything else.
furnace-fuel: [charcoal, coal, lava_bucket]
# The fuel golems bring also covers this many MORE items than are waiting (0 to 64).
# The next load of items then doesn't need a fuel trip of its own. Golems only fetch
# fuel when what is waiting isn't covered. This setting only changes how much they
# bring then.
# One charcoal or coal cooks 8 items. At the default 16, a furnace with 8 items waiting
# gets 3 charcoal instead of 1.
# 0: just enough for what is waiting. That is about one fuel trip after every load,
# and a furnace can go out between them.
# Higher: fewer fuel trips, but more fuel sits in furnaces' fuel slots instead of the
# [Fuel] chest. It isn't lost, it burns once there is something to cook.
# Set it about the same as carry-amount.
furnace-fuel-ahead: 16
# Lava buckets go into a furnace only when it has a backlog of at least this many items
# to cook (0 to 1000), and only if a [Fuel] container also has another fuel from
# furnace-fuel.
# The backlog is what is waiting in the furnace, plus what other golems are bringing
# it, plus its share of the matching items in [Furnace Supply] containers in range
# (shared with the other labelled furnaces that take them). Items you add to the supply
# later aren't counted until they are there. /cgc check on a furnace shows its backlog.
# A lit furnace keeps burning its fuel even after it runs out of things to cook, and
# one lava bucket lasts 100 items. At the default 100, a bucket is used only when it
# will burn out while cooking.
# Below this backlog, golems bring the next fuel on the list instead (just enough, see
# furnace-fuel-ahead). If there is no other fuel, they use lava anyway.
# 0: lava whenever it is its turn in furnace-fuel.
# Lower: lava is used more often and some can be wasted.
# Higher: lava is used only for big piles.
# Only matters when lava comes before another fuel in furnace-fuel, or that fuel runs out.
furnace-lava-min-items: 100
# When golems top a furnace up: only once this many items or fewer are left waiting in
# it (0 to 64). At the default 16, a furnace has about 160 seconds of cooking left
# (80 for a smoker or blast furnace). That gives a golem busy elsewhere (sorting, fuel,
# emptying other furnaces) time to get there before the furnace runs dry.
# Lower: a furnace can sit idle while golems are busy. 0 means only when empty.
# 8 is enough with one golem and one furnace.
# Higher: more, smaller trips. At 64, golems top up after every single item and walk
# back and forth all the time (wasted trips and a little more server work).
furnace-refill-below: 16
# A load is split between 2 furnaces only if each gets at least this many items (1 to 64).
# Otherwise it all goes into one furnace. A load never goes to more than 2 furnaces.
# While a golem carries a load, other golems leave its furnaces alone, so a load spread
# over many furnaces kept them waiting (in tests, carry-amount 64 over 6 furnaces cooked
# 20% less).
# At the default 8, a golem carrying 16 (carry-amount) splits it 8 + 8. If more furnaces
# are running low, the emptiest get it and the rest get the next load.
# Lower than half of carry-amount changes nothing.
# Above half of carry-amount (9 or more at the default 16): the whole load always goes
# to one furnace. That means fewer stops per trip, but furnaces start one at a time.
furnace-split-min: 8
# Golems take what a furnace made out once this many are ready (1 to 64). They also go
# sooner when the furnace won't make more for now:
# - nothing left to cook,
# - not burning (out of fuel, or its output slot holds something else, like an item a
#   player left there, so it can't light),
# - or its output slot is full.
# Only matters for furnaces without a hopper under them.
# At the default 8, one trip carries 8 or more.
# 1: take out every single item as it is done. A golem walks to the furnace for each
# one and has less time for refills and sorting.
# Higher: fewer trips, but finished items wait longer in the furnace. A full output
# slot (64) stops the furnace, so golems always empty a full one first.
furnace-take-out-at: 8
# If a furnace has filled up by the time a golem gets there (another golem or a player
# got there first), the golem waits beside it this many seconds (0 to 300) for an item
# or two to finish. Then it puts the rest in and takes whatever still doesn't fit back
# to the [Furnace Supply] it came from.
# 0: take it straight back. This can turn into a loop of fetching and returning the
# same items as the furnace frees up.
# Very long waits keep that golem standing there, doing no sorting, the whole time.
furnace-wait-seconds: 20
# Furnace upkeep comes before sorting. An idle golem picks its next job in this order:
#   1. Furnace upkeep: empty furnaces that stopped because their output is full, take
#      out empty lava buckets, bring fuel, bring items to cook from a [Furnace Supply],
#      and take out finished items (see furnace-take-out-at).
#   2. Sort the copper chests.
#   3. Re-sort the [Overflow] chests.
# So a big bank of furnaces can't hold up sorting forever: while a copper chest has
# items, the golem sorts once after this many furnace jobs in a row (0 to 64).
# 0: sorting always comes first (how golems worked before 3.1.0).
# Higher: furnaces stay busier, and copper chests (and the hoppers filling them) wait
# longer.
furnace-jobs-before-sorting: 3
# With GriefPrevention, golems use furnaces and [Fuel]/[Furnace Supply] containers
# in the claim their copper chest is in.
# true: also in claims where that claim's owner has container trust.
furnace-trusted-claims: true

# /cgc find <item> shows which containers near a player hold an item. By default,
# players only see containers inside GriefPrevention claims they own (never locked
# ones). The coppergolemclerk.allclaims permission (ops) sees everything.
# false turns the command off.
find-enabled: true
# true: /cgc find also shows unclaimed containers and claims where the player has
# container trust. Other players' claims stay hidden either way.
# Without GriefPrevention there are no claims, so players find nothing unless this
# is true.
find-outside-own-claims: false
# How far /cgc find looks (1 to 64 blocks, sideways and up and down). Bigger finds more
# but checks more blocks each time someone uses it.
find-radius: 32
# The most a player can ask for with /cgc find <item> <radius> (1 to 128 blocks; never
# less than find-radius). Bigger numbers are cut down to this.
# Ops (coppergolemclerk.allclaims) and the console aren't limited.
# Only chunks that are already loaded are searched.
# /cgc golems <radius> isn't limited either, because it searches nothing and players see
# only their own golems.
find-max-radius: 64
# How many of the containers /cgc find finds glow for the player who asked, nearest
# first (0 to 30; 0 = no glow).
find-highlight-count: 5
# How long those containers glow, in seconds (0 to 120; 0 = no glow).
find-highlight-seconds: 10

# Golems give way to each other instead of getting stuck nose to nose. When a golem is
# stuck (trying to walk but barely moving for a second) because another golem is in
# its way, one of them steps one block aside and waits for the other to pass.
# A golem with empty hands gives way to one carrying an item. If both carry something
# (or both are empty), the same golem of the pair always gives way.
# Golems busy at a chest never step aside.
golems-give-way: true

# Golems never walk onto or through a trapdoor, open or closed. Vanilla golems treat
# an open trapdoor as floor and fall through it into the hole below.
# Golems stepping aside for each other (golems-give-way) avoid trapdoors too.
avoid-trapdoors: true

# Golems never go through a Nether portal, End portal or End gateway. One that wanders
# into a portal stays in its own world near its copper chest.
# Golems on a lead or riding something go through as usual (a player is taking them).
avoid-portals: true

# Golems never step into or onto a cauldron holding lava, water or powder snow.
# Vanilla golems keep their paths away from lava cauldrons but can still slip or be
# pushed into one (and burn), and walk across a water or powder snow cauldron set into
# the floor and drop in. A golem turned back from one is walked around it (up to 24
# blocks out of its way). One that touches a lava cauldron anyway isn't hurt or set
# alight. Golems filling buckets at a lava cauldron stand beside it as before.
# An idle golem turned back from one doesn't wander within about 2 blocks of it for
# 30 seconds, so a cauldron in a nook doesn't draw it back again and again.
# Golems stepping aside for each other (golems-give-way) avoid these cauldrons too.
# Golems on a lead or riding something are left alone (a player is taking them).
avoid-cauldrons: true

# Once a week (and a minute after the server starts), check GitHub for a newer release
# of this plugin. If there is one, it is logged, and admins (op, or the
# coppergolemclerk.admin permission) are told once when they join.
# Nothing is downloaded or sent besides the request itself.
# /cgc version checks right away.
update-check: true

# How high golems reach, in chest rows counted up from the floor they stand on:
# 1 is the chest at their feet, 2 the one on top of it. Vanilla golems reach 2.
# Raise these (up to 6) for taller stacks of chests. Golems walk to the foot of the
# stack and the plugin moves the items for them, while the golem reaches in with vanilla's
# animation. They need floor to stand on in front of the chest.
# deliver-reach: chests golems put items into (labelled, matching, [Overflow], empty), 2 to 6.
deliver-reach: 2
# take-reach: copper chests golems take items from, and [Overflow] chests that idle
# golems fetch from (2 to 6 rows, like deliver-reach). Above 2 the plugin does the taking.
take-reach: 2

# How far golems look for things to do: chests to put items into, copper chests to take
# from, [Overflow] chests to fetch from, and furnaces to keep going.
# The distance is in blocks each way sideways from where the golem stands (a square,
# like vanilla's). Up and down stays 8. 32 is vanilla's own range and the lowest
# allowed. The most is 128.
# Above 32, the plugin walks golems to chests that vanilla golems can't see and moves
# the items for them. Walks take longer, and each search covers more chunks: about 2.5
# times as many at 64 as at 32, and about 7.4 times at 128.
# Chests in unloaded chunks are never found, whatever this is set to.
#
# Tick-rate cost: the time golems add to each server tick grows with this setting.
# Measured with 20 working golems among 1,817 chests, per golem per tick: about
# 0.055 ms at 32, 0.09 ms at 64, 0.15 ms at 96 and 0.26 ms at 128. A tick has 50 ms
# (20 TPS) for everything on the server. So 100 golems at 128 would use about half of
# it, and the same golems at 32 about a tenth.
# Raise it only as far as your storage needs, and check /mspt (or /tps) after you do.
# See "Bigger storage areas" in the README.
search-distance: 32

# Which containers golems put items into. Vanilla golems only use chests and trapped
# chests. Add barrel and/or shulker_box (every colour) and golems use those too. The
# golem walks up to it and the plugin puts the item in, with labels, contents matching
# and [Overflow] working as for chests.
# Take chest out to keep golems away from plain chests.
# Golems always take items from copper chests.
destination-containers: [chest, trapped_chest]

# Players can switch a single copper golem back to plain vanilla behavior (and back
# again) by right-clicking it with this item.
# While a player holds it, golems using this plugin show that player a small green
# light on their antenna. Vanilla golems don't.
# Where GriefPrevention is installed, only players allowed to build where the golem
# stands can switch it.
# Needs the coppergolemclerk.toggle permission (everyone has it by default).
# Set to none to turn switching off.
golem-toggle-item: bamboo
# Show the green light (to players holding the toggle item) on golems that use this plugin.
mode-markers: true
# While a player holds the toggle item, golems near them also show a small label saying
# what they are doing ("carrying 12 birch log", "fetching granite", "lost, walking
# home", "idle") and how weathered their copper is. Only players holding the item see
# the labels.
status-labels: true

# A copper golem with nothing to do walks over to say hello to an iron or snow golem
# it can walk up to, within 2 blocks up or down and within 16 blocks of its home (see
# rescue-lost-golems). Greetings never get in the way of work, and never take a golem
# anywhere it couldn't walk back to work from. With no home in range,
# it uses its nearest copper chest or furnace, or else where it stands. It turns back if
# it gets more than 20 blocks from there. After a visit it goes back to its routine, and walks
# back to its chest or furnace if the visit ended without a hello. It doesn't follow
# them, and waits greet-cooldown-minutes before greeting again.
# true (default): greetings on.
# false: no greetings.
greet-other-golems: true
# How long a golem waits after greeting before it greets again (minutes). Lower means
# more visits. They are purely for show, and any work that turns up ends a visit.
greet-cooldown-minutes: 5
# A copper golem that has had nothing to do for 20 seconds walks to a free cushion within
# 8 blocks (2 up or down, and within 16 blocks of its work) and sits on it. It gets up
# as soon as there's work, and greetings come first: a seated golem gets up to say hello.
# It only takes a path it could walk back along. Golems have no sitting pose, so a seated
# golem stands on the cushion. When the plugin stops (or this is turned off, or the golem
# is switched to vanilla), golems it sat down get up; vanilla never gets a golem off a cushion.
# true (default): golems sit on cushions.
# false: they don't.
sit-on-cushions: true

# Lost golems: a golem's home is the last place it got work from (the copper chest it
# took items from, the [Overflow] chest it fetched from, the [Furnace Supply] or [Fuel]
# container it took from, or the furnace it took finished items out of). If no work place
# (copper chest, furnace, [Overflow], [Fuel] or [Furnace Supply] container) is in its
# range and its home is more than 40 blocks away (or 12 up or down, e.g. after falling
# down a shaft), it walks back.
# If it can't get any closer, or it is stuck where it can't walk to a copper chest
# (a pit, walled in), its owner gets an alert (see below) saying where it is. The golem
# tries again every 5 minutes.
# A golem with no home takes the nearest work place in its range as home, or walks to
# one up to 64 blocks away. With none that close it is left alone.
# A golem moved to a place with its own copper chest just adopts that one.
# Golems on a lead are left alone.
rescue-lost-golems: true
# Teleport a golem that can't walk back to its home, instead of only telling
# the owner. Off by default.
# Even when on, a golem is teleported only if the owner of the GriefPrevention claim its
# home is in has the coppergolemclerk.teleport permission. Nobody has it unless
# you grant it, e.g. with LuckPerms. For an owner who is offline, the plugin asks
# LuckPerms. Golems whose home isn't in a claim are never teleported.
lost-golem-teleport-home: false

# Alerts: players are told when a golem is lost (above), finds a labelled chest full, or
# an [Overflow] chest is filling up.
# An alert goes to the owner of the GriefPrevention claim where it happens (an owner who
# is offline is told when they join). Outside claims, or without GriefPrevention, it
# goes to online players with coppergolemclerk.alerts (ops by default).
# Every alert is also written to the server log.
full-chest-alerts: true
# Warn when an [Overflow] chest has at least this many of its slots in use (percent).
# 0: only when it is completely full.
overflow-alert-percent: 90
# Don't repeat an alert about the same chest more often than this.
alert-cooldown-minutes: 30

# When a player joins, tell them how many items golems sorted in their claims while they
# were away, and how many of their chests filled up. Without GriefPrevention, these are
# server-wide numbers, shown to players with coppergolemclerk.alerts.
# /cgc stats shows the numbers any time.
join-summary: true

# Write a line in the server log when a copper golem dies (with the cause, e.g. lava,
# fall or a mob, and what it was holding) or is removed another way (turned into a
# statue, /kill, another plugin). Golems never despawn, so this explains every golem
# that goes missing.
log-golem-deaths: true

# Golems tidy a chest while putting something in it. Partial stacks of the same item
# are merged, and like items are moved next to each other (by group, in the order the
# groups are listed in groups.yml). Copper chests and chests a player has open are left alone.
tidy-chests: true

# Worlds where the plugin does nothing (golems there behave as in vanilla), by folder
# name, e.g. [world_nether, world_the_end].
disabled-worlds: []

# Golem limits: how many copper golems in one GriefPrevention claim use this plugin.
# Each claim counts on its own, admin claims too. The oldest golems keep the plugin
# behavior. The newest over the limit sort like vanilla, and the claim owner (or players
# with coppergolemclerk.alerts) is told.
# Golems on unclaimed land, and every golem without GriefPrevention, aren't limited.
# 0 = no limit.
# Each working golem costs about 0.1 ms per tick with or without this plugin, so golems
# over the limit still cost the same tick time (see the README).
max-golems-per-claim: 0

# Bigger claims get more golems: one more for every this many claim blocks of the
# claim's area, on top of max-golems-per-claim. E.g. 5 and 2500: a 100x100 claim
# (10,000 blocks) gets 9.
# With max-golems-per-claim 0, a claim smaller than this gets none.
# 0 = off.
claim-blocks-per-extra-golem: 0

# Let players use /cgc golems to list their own golems: those in claims they own, or
# whose copper chest is in one. Without GriefPrevention, it lists the golems within
# 48 blocks of them.
# Off by default: only admins can use it.
golems-command-for-players: false

# true: write a line to the server console (and logs/latest.log) for every decision the
# plugin makes, with the reason. It doesn't change what golems do, and players never
# see it. It covers:
# - which chests a golem may go to, and why a delivery is accepted or refused (label,
#   group, exact match, [Overflow], empty chest)
# - furnace jobs (fetching supply or fuel, putting items in, taking output out,
#   waiting, giving up on a furnace it can't reach)
# - [Overflow] fetches and items returned to their copper chest
# - golems giving way, greeting, topping up a carry, reaching higher chests, avoiding
#   portals, being switched to vanilla, tidying chests, and update checks
# Use it while setting up groups and labels, or when golems do something unexpected,
# then turn it off. It writes several lines per golem per delivery, which fills the
# log fast with many golems.
# /cgc reload applies it without a restart.
# For each golem's every move, see trace-golems.
debug: false

# true: once a second, log each copper golem's animation state, block position, held
# item and whether it is walking somewhere, whenever any of those changed. That is up
# to a line a second per walking golem, plus a reminder line every 5 seconds while it
# carries something.
# Even chattier than debug. Turn it on only to follow exactly what golems are doing
# (for example during long pauses), and off again after. It doesn't change what golems do.
trace-golems: false

# The item groups and their other names (group-aliases) are in groups.yml, next to this
# file. Before 3.3.0 they were here; the first start of 3.3.0 moves them there unchanged.
