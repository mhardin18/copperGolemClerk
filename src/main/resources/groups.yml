# Copper Golem Clerk: item groups
#
# A golem may put an item into a chest that holds other items from one of the item's
# groups (match-mode in config.yml says how strictly), and a sign label can name a
# group: [logs]. This file has the groups and their other names (group-aliases);
# every other setting is in config.yml.
#
# Use /cgc reload after editing this file. If it has a mistake, nothing changes and
# you're told which line to fix.
#
# Upgrading the plugin never changes your groups or aliases. Only the explanation right
# above group-aliases: and groups: is replaced with the new version's (the old file is
# kept as groups-before-<version>.yml). /cgc groups shows how yours differ from the
# new version's built-in groups.

# Other names for groups. A sign with an alias means the same as the group's own name,
# so [mechanisms] can mean the redstone group. Aliases work everywhere a group name
# does: sign labels, [Only ...] filters, /cgc find and /cgc check.
# Each line is alias: group, or alias: [group, group] for several groups at once.
# Spaces, dashes and plurals work as for group names ([mechanism] = mechanisms).
# Examples:
#   group-aliases:
#     mechanisms: redstone
#     cooking: [food, seeds]
# A group's own name always wins over an alias. An alias that names a group that
# doesn't exist is ignored, and the console says why.
# When a group's name is too wide for a sign line, label suggestions use an alias
# that fits. Empty ({}) by default. /cgc reload applies changes.
group-aliases: {}

# Each group is a list of entries. An item can be in more than one group.
# A group's name is its sign label ([light sources] for light-sources), so keep names
# short. A sign line holds about 15 letters. A longer label can continue on the next
# line, but one line is easier.
# Upgrading never changes this list. /cgc groups shows how yours differ from this
# version's. GROUPS.md (next to the README on GitHub) lists every built-in group, its
# items and what each release changed.
# Entry formats:
#   DIAMOND            one item (minecraft:diamond also works)
#   *_ORE              name pattern; * matches any letters (or none), whole ID must fit
#   #minecraft:logs    a vanilla or datapack item tag (#logs also works)
#   @edible            items you can eat
#   @fuel              items that burn in a furnace
#   @record            music discs
# The default groups cover nearly every item you can get in survival on 26.3.
