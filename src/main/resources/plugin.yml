name: CopperGolemClerk
version: '${version}'
main: com.exigentsol.coppergolemclerk.CopperGolemClerk
api-version: '26.3'
description: Copper golems file your items properly - by group, by sign label, into overflow chests and furnaces - and look after themselves.
softdepend: [GriefPrevention]
permissions:
  coppergolemclerk.toggle:
    description: Switch a copper golem between this plugin's sorting and vanilla (right-click with golem-toggle-item).
    default: true
  coppergolemclerk.alerts:
    description: Hear alerts (full chests, lost golems) about places outside anyone's GriefPrevention claim.
    default: op
  coppergolemclerk.find:
    description: Use /cgc find to see which containers near you (that you could open) hold an item.
    default: true
  coppergolemclerk.find.allclaims:
    description: /cgc find also looks into containers in other players' GriefPrevention claims, and locked ones.
    default: op
  coppergolemclerk.admin:
    description: Use every /cgc command (check, golems, overflow, stats, reload, version; find around any spot); hear about new releases.
    default: op
