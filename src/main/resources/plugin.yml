name: CopperGolemClerk
version: '${version}'
main: com.exigentsol.coppergolemclerk.CopperGolemClerk
api-version: '26.3'
description: Copper golems sort similar items into the same chest.
softdepend: [GriefPrevention]
permissions:
  coppergolemclerk.toggle:
    description: Switch a copper golem between this plugin's sorting and vanilla (right-click with golem-toggle-item).
    default: true
  coppergolemclerk.alerts:
    description: Hear alerts (full chests, lost golems) about places outside anyone's GriefPrevention claim.
    default: op
  coppergolemclerk.admin:
    description: Use /cgc help, check, overflow, reload and version; hear about new releases.
    default: op
